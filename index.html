<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift and Protein Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one narrow column, three bottom tabs (Today, Protein, Progress). Gym-signage type, iron-orange accent. */
  --bg:#f2f4f1;
  --surface:#ffffff;
  --surface2:#e8ece9;
  --ink:#18201e;
  --muted:#566360;
  --line:#d6ddd9;
  --accent:#b8441a;
  --accent-ink:#ffffff;
  --good:#25744a;
  --good-bg:#dff0e5;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111514; --surface:#1a2120; --surface2:#242d2b; --ink:#e8eeeb; --muted:#9aa8a3; --line:#2c3633;
    --accent:#f08a58; --accent-ink:#1b1209; --good:#5cc58a; --good-bg:#1c3828;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#1a2120; --surface2:#242d2b; --ink:#e8eeeb; --muted:#9aa8a3; --line:#2c3633;
  --accent:#f08a58; --accent-ink:#1b1209; --good:#5cc58a; --good-bg:#1c3828;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%;padding-bottom:88px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#shell{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:16px 0 8px;display:flex;flex-direction:column;gap:6px}
.kicker{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.kicker b{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.datenav{display:flex;align-items:center;gap:8px}
.datenav h1{flex:1;margin:0;text-align:center;font:700 30px/1.1 var(--display);letter-spacing:.01em;text-wrap:balance}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:22px;line-height:1}
.ib[disabled]{opacity:.35;cursor:default}
.todaylink{align-self:center;background:none;border:0;color:var(--accent);font-weight:600;padding:4px 8px;min-height:32px}
main{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.done{border-left:5px solid var(--good)}
.card h2{margin:0;font:600 21px/1.15 var(--display);letter-spacing:.01em}
.card h3{margin:0 0 8px;font:600 13px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.meta{font-size:14px;color:var(--muted);margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:42px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)}
.big{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font:500 15px var(--body);color:var(--muted)}
.check{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 0;cursor:pointer}
.check input{width:26px;height:26px;accent-color:var(--good);flex:none;margin:0}
.check span{flex:1}
.check small{color:var(--muted)}
.check + .check{border-top:1px solid var(--line)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px;margin-top:12px}
.dial{min-height:52px;padding:4px 0}
.dial + .dial,.check + .dial{border-top:1px solid var(--line)}
.cell{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.cell label{font-size:12px;color:var(--muted);text-align:center}
.reps{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;font:600 20px var(--body);font-variant-numeric:tabular-nums;padding:0}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.stepper output{min-width:74px;text-align:center;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.tip{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--good-bg);color:var(--good);font-size:14px;font-weight:600}
.last{margin-top:10px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 12px;min-height:40px;font-weight:500}
.chip b{color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;min-height:46px;padding:0 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.food{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 0;background:none;border:0;text-align:left}
.food + .food{border-top:1px solid var(--line)}
.food .fn{display:flex;flex-direction:column}
.food small{color:var(--muted)}
.food .fg{font:700 20px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--good);margin-left:6px}
.log{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.log + .log{border-top:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);width:44px;height:44px;font-size:20px}
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input[type=text],.field input[type=number],.inp{flex:1;min-width:90px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
.num{width:90px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;font:600 18px var(--body)}
textarea.sum{width:100%;min-height:118px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;resize:vertical;font:14px/1.45 var(--body)}
.dots{display:grid;grid-template-columns:54px repeat(14,1fr);gap:4px 3px;align-items:center;font-size:12px;color:var(--muted)}
.dots .d{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line)}
.dots .d.on{background:var(--accent);border-color:var(--accent)}
.dots .d.on.g{background:var(--good);border-color:var(--good)}
.dots .lb{text-align:center;font-size:11px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat3 .big{display:block}
.stat3 span{font-size:12px;color:var(--muted)}
.exrow{display:grid;grid-template-columns:1fr auto 92px;gap:10px;align-items:center;min-height:52px}
.exrow + .exrow{border-top:1px solid var(--line)}
.exrow .delta{font-weight:600;color:var(--good);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2);aspect-ratio:1;display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phl{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
#pv{position:fixed;inset:0;background:rgba(8,10,10,.94);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#pv[hidden]{display:none}
#pv img{max-width:100%;max-height:calc(100% - 80px);object-fit:contain;border-radius:8px}
#pv .pvb{display:flex;gap:10px}
#pv .btn.ghost{color:#f08a58;border-color:#f08a58}
svg.sp{width:92px;height:26px;display:block}
svg.sp polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.sp circle{fill:var(--accent)}
svg.bwc{width:100%;height:auto;display:block}
svg.bwc text{fill:var(--muted);font:11px var(--body)}
svg.bwc line{stroke:var(--line)}
svg.bwc polyline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.bwc circle{fill:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.tabs div{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:none;min-height:64px;font:600 14px var(--body);letter-spacing:.04em;color:var(--muted);border-top:3px solid transparent;padding:8px 4px 12px}
nav.tabs button.on{color:var(--ink);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:92%}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="kicker"><b>Lift and Protein Log</b><span id="sync" aria-live="polite">On this device</span></div>
    <div class="datenav">
      <button class="ib" id="prev" data-a="day" data-d="-1" aria-label="Previous day">&#8249;</button>
      <h1 id="dlabel"></h1>
      <button class="ib" id="next" data-a="day" data-d="1" aria-label="Next day">&#8250;</button>
    </div>
    <button class="todaylink" id="tl" data-a="today" hidden>Back to today</button>
  </header>
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Sections"><div>
  <button data-a="tab" data-t="today" id="t-today">Today</button>
  <button data-a="tab" data-t="protein" id="t-protein">Protein</button>
  <button data-a="tab" data-t="progress" id="t-progress">Progress</button>
</div></nav>
<div id="pv" hidden role="dialog" aria-modal="true" aria-label="Session photo">
  <img id="pvi" alt="Session photo">
  <div class="pvb"><button class="btn ghost" data-a="pvclose">Close</button><button class="btn" id="pvrm" data-a="pvrm">Remove photo</button></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- Plan ---------- */
var WK = {
  tue:{name:'Tuesday', sub:'Free weights and core', ex:[
    {id:'curl',n:'Bicep curls',sets:3,lo:12,hi:15,w:20,inc:5},
    {id:'tri',n:'Triceps press',sets:3,lo:12,hi:15,w:25,inc:5},
    {id:'sarow',n:'Single-arm row',sets:3,lo:12,hi:15,w:25,inc:5,note:'each side'},
    {id:'incl',n:'Incline chest press',sets:3,lo:12,hi:15,w:30,inc:5},
    {id:'plank',n:'Plank',sets:3,lo:30,hi:45,w:0,nw:true,unit:'sec'},
    {id:'rdl',n:'Romanian deadlift',sets:3,lo:12,hi:15,w:30,inc:5},
    {id:'squat',n:'Squats',sets:3,lo:12,hi:15,w:0,inc:5,note:'bodyweight, add load when easy'}
  ]},
  wed:{name:'Wednesday', sub:'Machines: legs, chest, back', ex:[
    {id:'legpress',n:'Leg press',sets:4,lo:12,hi:15,w:140,inc:10},
    {id:'chestm',n:'Chest press machine',sets:4,lo:10,hi:12,w:60,inc:5},
    {id:'lat',n:'Lat pulldown',sets:4,lo:10,hi:12,w:80,inc:5},
    {id:'legcurl',n:'Leg curl',sets:3,lo:12,hi:15,w:50,inc:5},
    {id:'hcr',n:'High cable row',sets:3,lo:12,hi:15,w:32.5,inc:2.5},
    {id:'situp',n:'Sit-ups',sets:3,lo:12,hi:15,w:0,nw:true}
  ]},
  thu:{name:'Thursday', sub:'Glutes, shoulders, back', ex:[
    {id:'bridge',n:'Glute bridges',sets:4,lo:10,hi:12,w:35,inc:5},
    {id:'scr',n:'Seated cable row',sets:4,lo:10,hi:12,w:42.5,inc:2.5},
    {id:'shp',n:'Shoulder press',sets:4,lo:10,hi:12,w:60,inc:5},
    {id:'legext',n:'Leg extension',sets:3,lo:12,hi:15,w:50,inc:5},
    {id:'tripd',n:'Tricep pushdown',sets:3,lo:12,hi:15,w:80,inc:5},
    {id:'sldl',n:'Single-leg deadlift',sets:3,lo:10,hi:12,w:30,inc:5,note:'each leg'},
    {id:'abc',n:'Ab crunch machine',sets:3,lo:12,hi:15,w:90,inc:5}
  ]}
};
var WARM = [
  {id:'arm',n:'Arm circles',d:'10 forward, 10 backward'},
  {id:'row',n:'Rowing machine',d:'1-2 min, about 200 strokes'},
  {id:'thread',n:'Thread the needle',d:'5 per side'}
];
var FOODS = [
  {id:'gy',n:'Greek yogurt',s:'1 cup',g:23,c:'Dairy and eggs'},
  {id:'cc',n:'Cottage cheese',s:'1 cup',g:25,c:'Dairy and eggs'},
  {id:'eggs',n:'Eggs',s:'2 large',g:12,c:'Dairy and eggs'},
  {id:'milk',n:'Milk',s:'1 cup',g:8,c:'Dairy and eggs'},
  {id:'string',n:'String cheese',s:'1 stick',g:7,c:'Dairy and eggs'},
  {id:'whey',n:'Whey protein shake',s:'1 scoop',g:24,c:'Dairy and eggs'},
  {id:'tofu',n:'Firm tofu',s:'7 oz, half a block',g:20,v:1,c:'Plant proteins'},
  {id:'tempeh',n:'Tempeh',s:'4 oz',g:22,v:1,c:'Plant proteins'},
  {id:'seitan',n:'Seitan',s:'3 oz',g:21,v:1,c:'Plant proteins'},
  {id:'lentils',n:'Lentils, cooked',s:'1 cup',g:18,v:1,c:'Plant proteins'},
  {id:'edamame',n:'Edamame, shelled',s:'1 cup',g:18,v:1,c:'Plant proteins'},
  {id:'bbeans',n:'Black beans, cooked',s:'1 cup',g:15,v:1,c:'Plant proteins'},
  {id:'chick',n:'Chickpeas, cooked',s:'1 cup',g:14,v:1,c:'Plant proteins'},
  {id:'pea',n:'Pea protein shake',s:'1 scoop',g:21,v:1,c:'Plant proteins'},
  {id:'soy',n:'Soy milk',s:'1 cup',g:7,v:1,c:'Plant proteins'},
  {id:'hemp',n:'Hemp seeds',s:'3 tbsp',g:10,v:1,c:'Boosters'},
  {id:'pb',n:'Peanut butter',s:'2 tbsp',g:7,v:1,c:'Boosters'},
  {id:'alm',n:'Almonds',s:'1 oz',g:6,v:1,c:'Boosters'},
  {id:'quin',n:'Quinoa, cooked',s:'1 cup',g:8,v:1,c:'Boosters'},
  {id:'oats',n:'Rolled oats',s:'1/2 cup dry',g:5,v:1,c:'Boosters'}
];
var CATS = ['Dairy and eggs','Plant proteins','Boosters'];
var NEXTUP = ['gy','cc','tofu','lentils','edamame','eggs','whey'];
var MEALS = [['bf','Breakfast'],['lu','Lunch'],['sn','Snack'],['pw','After workout'],['di','Dinner']];
var IDEAS = [
  {m:'Breakfast',t:'Scrambled eggs (2) with Greek yogurt (1 cup)',g:35},
  {m:'Lunch',t:'Lentil soup (1 cup lentils) with cottage cheese (1/2 cup)',g:30},
  {m:'Snack',t:'Greek yogurt (1 cup) with almonds (1 oz)',g:29},
  {m:'After workout',t:'Protein shake (1 scoop) with milk (1 cup)',g:32},
  {m:'Dinner',t:'Tofu stir-fry (7 oz), edamame (1 cup), quinoa (1 cup)',g:44}
];
var ALLEX = [];
Object.keys(WK).forEach(function(k){ WK[k].ex.forEach(function(e){ ALLEX.push(e); }); });
function exById(id){ for (var i=0;i<ALLEX.length;i++) if (ALLEX[i].id===id) return ALLEX[i]; return null; }

/* ---------- State ---------- */
var KEY = 'lpl-v1';
function blank(){ return {wk:null,warm:{},cool:false,ex:{},bike:false,sit:'',push:'',items:[],meals:{},bw:'',photos:[]}; }
function loadLocal(){
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.days) return s; } catch(e){}
  return {days:{},target:110,tu:0};
}
var S = loadLocal();
var cur = ymd(new Date());
var tab = 'today';
var veganOnly = false;
var DOC_COL = null, dirty = {}, saveT = null, saving = false, again = false, cloudOn = false;

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateOf(k){ return new Date(k+'T12:00:00'); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function D(){ return S.days[cur] || blank(); }
function E(){ if (!S.days[cur]) S.days[cur] = blank(); S.days[cur].u = Date.now(); dirty[cur.slice(0,7)] = 1; return S.days[cur]; }
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function commit(rerender){ saveLocal(); queueCloud(); if (rerender !== false) render(); }
function fmt(n){ return (Math.round(n*10)/10).toString(); }

function wkKey(){
  var d = D();
  if (d.wk) return d.wk === 'off' ? null : d.wk;
  return {2:'tue',3:'wed',4:'thu'}[dateOf(cur).getDay()] || null;
}
function lastSess(id){
  var ds = Object.keys(S.days).filter(function(k){ return k < cur; }).sort().reverse();
  for (var i=0;i<ds.length;i++){
    var x = S.days[ds[i]].ex && S.days[ds[i]].ex[id];
    if (x && x.sets.some(function(s){ return s.d; })) return {date:ds[i],w:x.w,sets:x.sets};
  }
  return null;
}
function sugg(e){
  var last = lastSess(e.id);
  if (!last) return {w:e.w,up:false,last:null};
  var hit = last.sets.every(function(s){ return s.d && Number(s.r) >= e.hi; });
  var up = hit && !e.nw && !!e.inc;
  return {w: up ? last.w + e.inc : last.w, up:up, last:last};
}
function ensure(d,e){
  if (!d.ex[e.id]) d.ex[e.id] = {w:sugg(e).w, sets:Array.from({length:e.sets},function(){ return {r:null,d:false}; })};
  return d.ex[e.id];
}
function protTotal(d){ return d.items.reduce(function(a,b){ return a + (Number(b.g)||0); },0); }

/* ---------- Cloud sync (private per-person storage) ---------- */
function setSync(t){ var el = document.getElementById('sync'); if (el) el.textContent = t; }
function queueCloud(){
  if (!cloudOn){ setSync('On this device'); return; }
  setSync('Saving…'); clearTimeout(saveT); saveT = setTimeout(flush, 900);
}
async function flush(){
  if (saving){ again = true; return; }
  saving = true;
  var keys = Object.keys(dirty); dirty = {};
  try {
    for (var i=0;i<keys.length;i++){
      var k = keys[i];
      if (k === 'meta') await DOC_COL.doc('meta').set({target:S.target,tu:S.tu||0});
      else {
        var days = {};
        Object.keys(S.days).forEach(function(dk){ if (dk.slice(0,7) === k) days[dk] = S.days[dk]; });
        await DOC_COL.doc('m-'+k).set({days:days});
      }
    }
    setSync('Saved');
  } catch(e){
    keys.forEach(function(k){ dirty[k] = 1; });
    setSync('Not synced');
  }
  saving = false;
  if (again){ again = false; queueCloud(); }
}
async function initCloud(){
  if (!(window.claude && window.claude.use)) return;
  setSync('Connecting…');
  var giveUp = setTimeout(function(){ if (!cloudOn) setSync('On this device'); }, 10000);
  try {
    var db = await claude.use('db'), user = await claude.use('user');
    if (!db || !user){ clearTimeout(giveUp); setSync('On this device'); return; }
    var id = await user.id();
    if (!id){ clearTimeout(giveUp); setSync('On this device'); return; }
    DOC_COL = db.collection('data/users/'+id);
    var snap = await DOC_COL.get();
    var rDays = {}, rTarget = null, rTu = 0;
    snap.docs.forEach(function(ds){
      var b = JSON.parse(JSON.stringify(ds.data() || {}));
      if (ds.id === 'meta'){ rTarget = b.target; rTu = b.tu || 0; }
      else if (b.days) Object.keys(b.days).forEach(function(k){ rDays[k] = b.days[k]; });
    });
    Object.keys(S.days).forEach(function(k){
      var a = S.days[k], b = rDays[k];
      if (!b){ rDays[k] = a; dirty[k.slice(0,7)] = 1; }
      else if ((a.u||0) > (b.u||0)){ rDays[k] = a; dirty[k.slice(0,7)] = 1; }
    });
    S.days = rDays;

function shrink(file){
  return new Promise(function(res){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var s = Math.min(1, 1600/Math.max(img.width,img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b || file); }, 'image/jpeg', 0.82);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

}

function spark(vals){

  var last = pts[pts.length-1];

    + '<div class="field" style="margin-top:12px"><input type="text" inputmode="decimal" id="bw" placeholder="Weight for '+esc(dateOf(cur).toLocaleDateString(undefined,{month:'short',day:'numeric'}))+'" value="'+esc(D().bw)+'" aria-label="Body weight in pounds"><button class="btn" data-a="bw">Save</button></div></section>';
  var rows = ALLEX.map(function(e){ return {e:e,h:hist(e.id)}; }).filter(function(r){ return r.h.length; });
  h += '<section class="card"><h3>Lift progress</h3>';
  if (!rows.length) h += '<div class="empty">Log a workout and your weights show up here, with a trend line once you have two sessions.</div>';
  rows.forEach(function(r){
    var ws = r.h.map(function(x){ return x.w; }), first = ws[0], lastW = ws[ws.length-1], dl = lastW-first;
    h += '<div class="exrow"><div><b>'+esc(r.e.n)+'</b><div class="meta">'+(r.e.nw ? r.h.length+' sessions' : (lastW?fmt(lastW)+' lb':'bodyweight')+' · '+r.h.length+' sessions')+'</div></div>'
      + '<span class="delta">'+(r.e.nw||!dl?'':(dl>0?'+':'')+fmt(dl)+' lb')+'</span>'
      + (r.e.nw ? '<span></span>' : spark(ws)) + '</div>';
  });
  h += '</section>';
  h += photoGallery();
  return h;
}

function render(){
  var y = window.scrollY;
  document.getElementById('dlabel').textContent = dateOf(cur).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  var today = ymd(new Date());
  document.getElementById('next').disabled = cur >= today;
  document.getElementById('tl').hidden = cur === today;
  ['today','protein','progress'].forEach(function(t){
    var b = document.getElementById('t-'+t); b.classList.toggle('on', t===tab); b.setAttribute('aria-current', t===tab ? 'page' : 'false');
  });
  var app = document.getElementById('app');
  app.innerHTML = tab==='today' ? viewToday() : tab==='protein' ? viewProtein() : viewProgress();
  window.scrollTo(0,y);
}

var toastT;
function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('show'); },2000); }
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- Events ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a]'); if (!el) return;
  var a = el.dataset.a, d, e, ent;
  if (a === 'pick'){ var pf = document.getElementById('pf'); if (pf) pf.click(); return; }
  if (a === 'view'){ openPhoto(el.dataset.id, el.dataset.date); return; }
  if (a === 'pvclose'){ closePhoto(); return; }
  if (a === 'pvrm'){ removePhoto(); return; }
  if (a === 'tab'){ tab = el.dataset.t; window.scrollTo(0,0); render(); return; }
  if (a === 'day'){ var x = dateOf(cur); x.setDate(x.getDate()+Number(el.dataset.d)); var n = ymd(x); if (n <= ymd(new Date())){ cur = n; render(); } return; }
  if (a === 'today'){ cur = ymd(new Date()); render(); return; }
  if (a === 'wk'){ d = E(); d.wk = el.dataset.k; commit(); return; }
  if (a === 'set'){
    e = exById(el.dataset.ex); d = E(); ent = ensure(d,e);
    var i = Number(el.dataset.i), s = ent.sets[i], inp = document.getElementById('r-'+e.id+'-'+i);
    if (inp && inp.value !== '' && !isNaN(Number(inp.value))) s.r = Number(inp.value);
    if (!s.d){ if (s.r == null) s.r = e.hi; s.d = true; } else s.d = false;
    commit(); return;
  }
  if (a === 'sets'){
    e = exById(el.dataset.ex); d = E(); ent = ensure(d,e);
    var dir = Number(el.dataset.dir);
    if (dir > 0 && ent.sets.length < 8) ent.sets.push({r:null,d:false});
    else if (dir < 0 && ent.sets.length > 1) ent.sets.pop();
    commit(); return;
  }
  if (a === 'adj'){
    d = E(); var key = el.dataset.k, st = Number(el.dataset.step), mn = Number(el.dataset.min), mx = Number(el.dataset.max);
    var nv = pref(key, Number(el.dataset.def)) + Number(el.dataset.dir)*st;
    d[key] = Math.round(Math.min(mx, Math.max(mn, nv))*10)/10; commit(); return;
  }
  if (a === 'wt'){
    e = exById(el.dataset.ex); d = E(); ent = ensure(d,e);
    ent.w = Math.max(0, Math.round((ent.w + Number(el.dataset.dir)*(e.inc||5))*10)/10); commit(); return;
  }
  if (a === 'food'){
    var f = FOODS.filter(function(z){ return z.id === el.dataset.id; })[0]; d = E();
    d.items.push({id:newId(),fid:f.id,n:f.n+' ('+f.s+')',g:f.g}); commit(); toast('Added '+f.g+' g'); return;
  }
  if (a === 'idea'){
    var idea = IDEAS[Number(el.dataset.i)]; d = E();
    d.items.push({id:newId(),n:idea.m+': '+idea.t,g:idea.g}); commit(); toast('Added '+idea.g+' g'); return;
  }
  if (a === 'rm'){ d = E(); d.items = d.items.filter(function(it){ return it.id !== el.dataset.id; }); commit(); return; }
  if (a === 'custom'){
    var nm = document.getElementById('cn').value.trim(), g = parseFloat(document.getElementById('cg').value);
    if (!nm || isNaN(g) || g <= 0){ toast('Enter a name and grams'); return; }
    d = E(); d.items.push({id:newId(),n:nm,g:g}); commit(); return;
  }
  if (a === 'bw'){
    var v = parseFloat(document.getElementById('bw').value);
    d = E(); d.bw = isNaN(v) ? '' : v; commit(); toast(isNaN(v) ? 'Cleared' : 'Saved'); return;
  }
  if (a === 'copy'){
    var txt = summaryText(), box = document.getElementById('sum');
    var fallback = function(){ if (box){ box.focus(); box.select(); } toast('Select and copy the text'); };
    try { navigator.clipboard.writeText(txt).then(function(){ toast('Copied'); }, fallback); } catch(err){ fallback(); }
    return;
  }
});
document.addEventListener('input', function(ev){
  var el = ev.target, f = el.dataset && el.dataset.f; if (!f) return;
  var d;
  if (f === 'reps'){
    var e = exById(el.dataset.ex); d = E(); var ent = ensure(d,e), s = ent.sets[Number(el.dataset.i)];
    var v = el.value.trim(); s.r = v === '' ? null : (isNaN(Number(v)) ? s.r : Number(v)); saveLocal(); queueCloud();
  } else if (f === 'sit' || f === 'push'){
    d = E(); d[f] = el.value.trim(); saveLocal(); queueCloud();
  }
});
document.addEventListener('change', function(ev){
  var el = ev.target, f = el.dataset && el.dataset.f; if (!f) return;
  var d;
  if (f === 'photo'){ var fl = el.files; if (fl && fl.length) addPhotos(fl); el.value = ''; return; }
  if (f === 'warm'){ d = E(); d.warm[el.dataset.id] = el.checked; commit(); }
  else if (f === 'cool'){ d = E(); d.cool = el.checked; commit(); }
  else if (f === 'bike'){ d = E(); d.bike = el.checked; commit(); }
  else if (f === 'meal'){ d = E(); d.meals[el.dataset.id] = el.checked; commit(); }
  else if (f === 'vegan'){ veganOnly = el.checked; render(); }
  else if (f === 'goal'){
    var g = parseInt(el.value,10);
    if (g >= 20 && g <= 400){ S.target = g; S.tu = Date.now(); dirty.meta = 1; commit(); } else { toast('Enter 20 to 400 g'); render(); }
  }
});

document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && pvRef) closePhoto(); });
render();
initCloud();
(async function(){
  try { if (window.claude && window.claude.use){ ASSETS = await claude.use('assets'); if (ASSETS) render(); } } catch(e){ ASSETS = null; }
})();
</script>
</body>
